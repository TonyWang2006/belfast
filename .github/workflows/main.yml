name: Scheduled Fork Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点自动执行一次
  workflow_dispatch: # 允许在页面上手动点击触发

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须显式声明写权限

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # 确保 CLI 能识别本地仓库上下文

      - name: Sync upstream using GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
